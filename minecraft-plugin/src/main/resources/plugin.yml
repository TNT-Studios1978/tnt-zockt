name: TNT-Shop
version: '${project.version}'
main: ch.tntzockt.shop.TntShopPlugin
api-version: '26.3'
description: Minecraft-Konto mit Twitch verknüpfen und Pakete mit Kanalpunkten kaufen (tnt-zockt.ch)
author: TNT-Studios
website: https://www.tnt-zockt.ch/minecraft.html
commands:
  link:
    description: Minecraft-Konto mit Twitch verknüpfen
    usage: /link
    permission: tntshop.use
  punkte:
    description: Zeigt deine Kanalpunkte
    usage: /punkte
    aliases: [points]
    permission: tntshop.use
  shop:
    description: Öffnet den TNT-Shop
    usage: /shop
    permission: tntshop.use
  store:
    description: Link zum TNT-Zockt Store (Ränge, nur Kosmetik)
    usage: /store
    aliases: [ränge, raenge]
    permission: tntshop.use
  partikel:
    description: Partikel-Effekt deines Rangs wählen
    usage: /partikel
    aliases: [particles]
    permission: tntshop.use
  tntrang:
    description: Ränge verwalten (wird von Tebex aus der Konsole benutzt)
    usage: /tntrang give|set|remove|info <spieler|uuid> [rang]
    permission: tntshop.admin
  welten:
    description: Weltenmenü öffnen
    usage: /welten
    aliases: [worlds, menu, menü]
    permission: tntshop.use
  lobby:
    description: Zur Lobby
    usage: /lobby
    aliases: [spawn, hub]
    permission: tntshop.use
  plot:
    description: Grundstücke (Parzellen)
    usage: /plot claim|home|visit|trust|untrust|info|clear
    aliases: [p, gs, grundstueck, grundstück, plots]
    permission: tntshop.use
  welt:
    description: Welten verwalten (Admin)
    usage: /welt reset farmwelt | /welt tp <welt>
    permission: tntshop.admin
  tntshop:
    description: Admin-Befehle des TNT-Shops
    usage: /tntshop reload
    permission: tntshop.admin
permissions:
  tntshop.use:
    description: Shop benutzen
    default: true
  tntshop.admin:
    description: Konfiguration neu laden
    default: op
