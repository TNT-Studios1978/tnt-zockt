# ============================================================
# TNT-Shop – Verbindung zu tnt-zockt.ch
# ============================================================

# Adresse der Shop-Schnittstelle (nicht ändern)
api-url: "https://www.tnt-zockt.ch/api/mc"

# Gemeinsames Geheimnis mit der Website.
# Muss GENAU gleich sein wie die Vercel-Umgebungsvariable MC_SERVER_SECRET
# (mindestens 24 Zeichen). Niemals öffentlich zeigen.
server-secret: ""

# Seite, auf der Spieler den /link-Code eingeben
link-page: "https://www.tnt-zockt.ch/minecraft.html"

# Gratis-Starterpaket beim allerersten Join (ohne Verknüpfung)
starter-kit:
  enabled: true
  items:
    - "WOODEN_PICKAXE:1"
    - "WOODEN_AXE:1"
    - "WOODEN_SWORD:1"
    - "BREAD:16"
    - "TORCH:16"

# Wartezeit zwischen zwei Käufen pro Spieler (Schutz vor Doppelklicks), in Sekunden
click-cooldown-seconds: 3

# ============================================================
# Ränge (Echtgeld über Tebex) – NUR Kosmetik, kein Spielvorteil
# (Mojang-Regeln). Reihenfolge = tief -> hoch. Ein höherer Rang
# bekommt auch alle Partikel der tieferen Ränge.
# Farben: Namen wie gold, aqua, yellow ... oder Hex wie "#ff8800"
# ============================================================
store-url: "https://tnt-zockt.tebex.store"

ranks:
  supporter:
    display: "Supporter"
    color: "aqua"
    icon: "GOLD_NUGGET"
    particles: [HEART, NOTE]
  vip:
    display: "VIP"
    color: "gold"
    icon: "DIAMOND"
    particles: [HAPPY_VILLAGER, END_ROD, ENCHANT]
  legende:
    display: "Legende"
    color: "light_purple"
    icon: "NETHER_STAR"
    particles: [FLAME, SOUL_FIRE_FLAME, TOTEM_OF_UNDYING, WITCH, ELECTRIC_SPARK]

# ============================================================
# Discord: Spielerliste + Beitritts-Meldungen über einen Webhook
# Discord-Kanal → Einstellungen → Integrationen → Webhooks → Neuer Webhook
# → "Webhook-URL kopieren" und hier einfügen. Leer = aus.
# Die URL ist geheim (wer sie hat, kann in den Kanal schreiben).
# ============================================================
discord:
  webhook-url: ""
  server-address: "stamina-elk.tun.ply.gg"
  join-messages: true      # Meldung, wenn jemand beitritt
  first-join-only: false   # true = nur bei ganz neuen Spielern melden
  leave-messages: false    # Meldung, wenn jemand geht

# ============================================================
# Welten. Survival-Gruppe (world, Nether, End, Lobby, Farmwelt) und
# Kreativ-Gruppe (Grundstücke, Kreativwelt) haben getrennte Inventare.
# ============================================================
worlds:
  lobby: "lobby"
  survival: "world"
  farm: "farmwelt"
  plots: "grundstuecke"
  creative: "kreativ"
  adventure: "abenteuer"   # Amplified-Welt, Inventar wie Survival
  skyblock: "skyblock"
  hardcore: "hardcore"
  event: "event"
  join-to-lobby: true     # beim Einloggen immer in der Lobby starten
  plot-size: 64           # Parzelle 64x64 Blöcke
  plot-road: 7            # Wegbreite zwischen den Parzellen
  plots-per-player: 1
